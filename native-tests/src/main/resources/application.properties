# Build the native executable inside a container (Mandrel builder image), so only Docker is
# required - which the Nextcloud dev service needs anyway.
quarkus.native.container-build=true
# Fixed test port, the dev service registers webhooks / the ExApp with it
quarkus.http.test-port=8081
quarkus.log.category."org.apache.http.client.protocol.ResponseProcessCookies".level=ERROR
# Value for the filter expressions of the event handlers
nextcloud.filter.admin-uid=${nextcloud.user}
nextcloud.file-lock-enabled=true
nextcloud.oidc.enabled-for-users=false
nextcloud.oidc.enabled-for-admins=false
nextcloud.dev-services.enable-oidc=false

# The auth mode is (partly) build-time fixed, so each mode is its own binary built with
# -Dquarkus.profile=<mode> (see native.mode in pom.xml)

# App password auth, including webhook events
%password.nextcloud.exapp.enabled=false
%password.nextcloud.webhook.build.auto-discovery-enabled=true

# ExApp (AppAPI) auth
%exapp.nextcloud.exapp.enabled=true
%exapp.nextcloud.webhook.build.auto-discovery-enabled=false
