# Builds a native executable with the extension for each auth mode and runs the risk-based native
# scenarios (native-tests module) against it, using the Nextcloud dev service.

name: Native tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The auth mode is fixed at build time, so each mode is a separate binary
        mode: [password, exapp]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Install extension
        # The JVM tests run in the regular build, not here
        run: mvn -B install -DskipTests

      - name: Build and run native tests
        # The native image is built inside a Mandrel builder container, so only Docker is needed
        run: mvn -B verify -Pnative-tests -pl native-tests -Dnative.mode=${{ matrix.mode }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-tests-${{ matrix.mode }}
          path: |
            native-tests/target/failsafe-reports/
            native-tests/target/quarkus.log
          if-no-files-found: ignore
