# Enable the Nextcloud webhook_listeners app and webhook worker in the dev-services container
nextcloud.exapp.enabled=true
# The webhook callback URL must be reachable from inside the Nextcloud container.
# host.docker.internal resolves to the host machine where the Quarkus test app runs.
# Use a fixed test port so the callback URL is predictable
quarkus.http.test-port=8081
