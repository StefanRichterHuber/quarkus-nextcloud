# Use a fixed test port so the callback URL is predictable
quarkus.http.test-port=8081
quarkus.log.category."org.apache.http.client.protocol.ResponseProcessCookies".level=ERROR
quarkus.test.profile.tags=auth-password,auth-oidc,auth-exapp,auth-password-with-event-handler
# JaCoCo: the quarkus-jacoco extension records coverage data for the in-JVM
# @QuarkusTest runs into target/jacoco-quarkus.exec. The per-module HTML report
# is disabled here because production code lives in the "runtime" module; the
# aggregated cross-module report is generated by the "coverage" module.
quarkus.jacoco.report=false
# The code under test is a Quarkus extension whose runtime jar is a normal
# dependency; tell the extension to instrument that artifact so its classes end
# up in the coverage data (the map key "nextcloudlib" is an arbitrary label).
quarkus.jacoco.instrument-artifacts.nextcloudlib.group-id=io.github.stefanrichterhuber
quarkus.jacoco.instrument-artifacts.nextcloudlib.artifact-id=nextcloudlib